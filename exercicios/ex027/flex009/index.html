<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightcoral;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">AAAAAAA</div>
        <div class="item">BBBBBB</div>
        <div class="item">CC</div>
        <div class="item">DDDD</div>
        <div class="item">EEEEEEEEEEEEEE</div>
        <div class="item">FF</div>
        <div class="item">G</div>
    </div>
</body>
</html>
